    <script>
      // Suppress benign Vite dev WebSocket / HMR connection drops in iframe/Cloud Run environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = ((event.message || '') + ' ' + (event.filename || ''));
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
