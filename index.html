    <script>
      // Suppress benign Vite dev WebSocket / HMR connection drops in iframe/Cloud Run environments
      (function() {
        function isViteWs(str) {
          if (!str) return false;
          var s = String(str);
          return s.indexOf('WebSocket') !== -1 || 
                 s.indexOf('websocket') !== -1 || 
                 s.indexOf('@vite/client') !== -1 || 
                 s.indexOf('[vite]') !== -1 ||
                 s.indexOf('vite-hmr') !== -1 ||
                 s.indexOf('ditutup tanpa dibuka') !== -1 ||
                 s.indexOf('closed without being opened') !== -1;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWs(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWs(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWs(arguments[i])) return;
          }
          return origLog.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event);
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isViteWs(msg)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = ((event.message || '') + ' ' + (event.filename || '') + ' ' + (event.error ? String(event.error) : ''));
          if (isViteWs(msg)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        // Gracefully handle WebSocket for vite-hmr in cloud sandboxes where WS is disabled
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var isHmr = (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
                        (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) ||
                        (typeof url === 'string' && (url.indexOf('@vite') !== -1 || url.indexOf('vite-hmr') !== -1));

            var ws;
            try {
              ws = new NativeWebSocket(url, protocols);
            } catch (err) {
              var dummy = new EventTarget();
              dummy.close = function() {};
              dummy.send = function() {};
              dummy.readyState = 3;
              return dummy;
            }

            if (isHmr && ws) {
              ws.addEventListener('error', function(e) {
                if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
                if (e && e.preventDefault) e.preventDefault();
              });
              ws.addEventListener('close', function(e) {
                if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
                if (e && e.preventDefault) e.preventDefault();
              });
            }
            return ws;
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
